<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f1f1"><link href="https://framework-gb.cdn.gob.mx/gm/v3/assets/styles/main.css" rel="stylesheet">
    <link href="https://framework-gb.cdn.gob.mx/gm/accesibilidad/css/gobmx-accesibilidad.min.css" rel="stylesheet">
    <title>Archivo UnADM — Diseño alternativo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: #f1f1f1;
            color: #080808;
            font-family: Arial, Helvetica, sans-serif;
        }

        .strm_alternate-home {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        .strm_wordmark {
            position: absolute;
            z-index: 0;
            color: #fff;
            font-size: clamp(7rem, 16vw, 15rem);
            font-weight: 700;
            letter-spacing: -0.085em;
            line-height: 0.8;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        .strm_wordmark-archivo {
            top: 28%;
            left: -0.04em;
        }

        .strm_wordmark-unadm {
            top: 53%;
            right: -0.04em;
        }

        .strm_search-panel {
            position: absolute;
            z-index: 1;
            left: 50%;
            width: min(540px, calc(100% - 40px));
            transform: translateX(-50%);
        }

        .strm_search-panel {
            top: 43.8%;
        }

        .strm_search-bar {
            animation: strm_focus-in 900ms cubic-bezier(0.2, 0.7, 0.25, 1) both;
        }

        .strm_search-bar {
            display: flex;
            height: 50px;
            padding: 0;
            overflow: hidden;
            border-radius: 999px;
            /*background: #000;*/
        }

        .strm_search-input {
            flex: 1;
            min-width: 0;
            height: 50px;
            margin: 0;
            padding: 0 20px;
            border: 0;
            outline: 0;
            background: #222222;
            color: #fff;
            font: inherit;
            font-size: 16px;
        }

        .strm_search-input:focus-visible {
            outline: none;
            box-shadow: none;
        }

        .strm_search-button {
            flex: 0 0 125px;
            border: 0;
            border-radius: 0px;
            background: linear-gradient(110deg, #222222, #20d38f);
            color: #ffffff;
            font: inherit;
            font-size: 16px;
            cursor: pointer;
        }

        .strm_search-button:hover,
        .strm_search-button:focus-visible {
            background: linear-gradient(110deg, #0269dc, #1bbd7f);
        }

        .strm_filters {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
            width: min(360px, calc(100% - 40px));
            margin: 18px auto 0;
            animation: strm_filters-in 220ms ease-out both;
        }

        .strm_filters[hidden] {
            display: none;
        }

        .strm_filters-toggle {
            display: block;
            margin: 6px auto 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: #222;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .strm_filters-toggle:hover,
        .strm_filters-toggle:focus-visible {
            text-decoration: underline;
        }

        @keyframes strm_focus-in {
            from {
                filter: blur(12px);
                opacity: 0.25;
                transform: scale(0.98);
            }

            to {
                filter: blur(0);
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes strm_filters-in {
            from {
                filter: blur(8px);
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                filter: blur(0);
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .strm_search-bar,
            .strm_filters {
                animation: none;
            }
        }

        .strm_filter-field {
            display: block;
            min-width: 0;
        }

        .strm_filter-label {
            display: block;
            margin: 0 0 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
        }

        .strm_filter-options {
            max-height: 136px;
            overflow-y: auto;
            border-left: 1px solid #999;
        }

        .strm_filter-option {
            display: block;
            width: 100%;
            min-height: 18px;
            margin: 0;
            padding: 1px 5px 1px 10px;
            color: #222;
            font-size: 12px;
            line-height: 16px;
            cursor: pointer;
        }

        .strm_filter-option input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            clip-path: inset(50%);
        }

        .strm_filter-option:has(input:checked) {
            background: #20d38f;
        }

        .strm_filter-option:focus-within {
            outline: 2px solid #0269dc;
            outline-offset: -2px;
        }

        @media (max-width: 600px) {
            .strm_wordmark {
                font-size: clamp(6rem, 24vw, 9rem);
            }

            .strm_wordmark-archivo {
                top: 22%;
            }

            .strm_wordmark-unadm {
                top: 44%;
            }

            .strm_search-panel {
                top: 37%;
            }

            .strm_search-button {
                flex-basis: 105px;
            }

            .strm_filters {
                grid-template-columns: 1fr;
                gap: 16px;
                width: 100%;
                margin: 20px 0 0;
            }

            .strm_filter-label {
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <main class="strm_alternate-home">
        <div class="strm_wordmark strm_wordmark-archivo" aria-hidden="true">Archivo</div>
        <div class="strm_wordmark strm_wordmark-unadm" aria-hidden="true">UnADM</div>

        <section class="strm_search-panel" aria-label="Buscar en el repositorio">
            <div class="strm_search-bar" role="search">
                <input class="strm_search-input strm_arc_search-input" type="search"
                    aria-label="Buscar por palabra clave, título o ID de recurso" autocomplete="off" autofocus>
                <button class="strm_search-button strm_arc_search-button" type="submit">Buscar</button>
            </div>

            <button class="strm_filters-toggle" type="button" aria-expanded="false" aria-controls="strm-search-filters">+ Agregar filtros</button>
            <div class="strm_filters" id="strm-search-filters" aria-label="Filtros de búsqueda" hidden>
                <section class="strm_filter-field" aria-labelledby="strm-year-label">
                    <span class="strm_filter-label" id="strm-year-label">Año</span>
                    <div class="strm_filter-options" data-filter-type="anio" role="group" aria-label="Filtrar por año"></div>
                </section>
                <section class="strm_filter-field" aria-labelledby="strm-theme-label">
                    <span class="strm_filter-label" id="strm-theme-label">Tema</span>
                    <div class="strm_filter-options" data-filter-type="tema" role="group" aria-label="Filtrar por tema"></div>
                </section>
                <section class="strm_filter-field" aria-labelledby="strm-format-label">
                    <span class="strm_filter-label" id="strm-format-label">Formato</span>
                    <div class="strm_filter-options" data-filter-type="formato" role="group" aria-label="Filtrar por formato"></div>
                </section>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
        <script src="https://framework-gb.cdn.gob.mx/gm/accesibilidad/js/gobmx-accesibilidad.min.js"></script>
        <script src="https://framework-gb.cdn.gob.mx/gm/v3/assets/js/gobmx.js"></script>
</body>

</html>
